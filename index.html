<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d141d">
  <meta name="description" content="A little space for posts worth keeping. A different perspective with every shuffle.">
  <title>Archie — A different perspective</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230d141d'/%3E%3Ctext x='11' y='30' font-family='Georgia' font-size='34' fill='%2391d4ff'%3Ea%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=help-beacon-20261014">
  <script type="module" src="toolbar.js?v=help-20261014"></script>
  <script type="module" src="app.js?v=help-20261014"></script>
</head>
<body>
  <a class="skip-link" href="#feed">Skip to posts</a>
  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <a class="wordmark" href="./" aria-label="Archie home">
        <span class="brand-mark" aria-hidden="true">a</span>
        <span>archie<span class="wordmark-dot">.</span></span>
      </a>
      <nav class="toolbar-navigation" aria-label="Site navigation">
        <a class="control-button help-button" href="Sites/help.html" aria-label="Help" title="Help">
          <!-- An original question-mark beacon in an angular energy frame. -->
          <svg class="help-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path class="help-frame" d="m14 2 10 6v12l-10 6-10-6V8l10-6Z"/>
            <path class="help-question" d="M10.5 10a3.5 3.5 0 0 1 7 0c0 2.5-3.5 2.5-3.5 5"/>
            <path class="help-dot" d="m14 18 1.5 1.5L14 21l-1.5-1.5L14 18Z"/>
          </svg>
          <span class="control-label">Help</span>
        </a>
      </nav>
      <div class="toolbar-actions">
        <button class="control-button interaction-button" id="interact" type="button" aria-controls="feed" aria-pressed="false" aria-label="Interact with posts" title="Interact with posts" disabled>
          <!-- An original energy-shield icon, inspired by Protoss shields. -->
          <svg class="shield-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path class="shield-outline" d="m14 3 9 4v8l-4 6-5 4-5-4-4-6V7l9-4Z"/>
            <path class="shield-core" d="m14 8 4 6-4 6-4-6 4-6Z"/>
            <path d="M14 5v3m0 12v3M7 14h3m8 0h3"/>
          </svg>
          <span class="control-label">Interact</span>
        </button>
        <button class="control-button shuffle-button" id="shuffle" type="button" aria-label="Shuffle" aria-controls="feed quote" disabled>
          <!-- An original warp-crystal icon, inspired by StarCraft's blue light. -->
          <svg class="warp-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path class="warp-orbit" d="M9 4H4v5m0-5 6 6M19 24h5v-5m0 5-6-6M4 19v5h5m-5 0 6-6M24 9V4h-5m5 0-6 6"/>
            <path class="warp-crystal" d="m14 5 5 9-5 9-5-9 5-9Z"/>
            <path d="M14 5v18m-5-9h10" opacity=".5"/>
          </svg>
          <span class="control-label">Shuffle</span>
        </button>
      </div>
    </div>
  </header>

  <main class="demo">
    <section class="intro" id="quote" aria-label="Quote" aria-live="polite" aria-atomic="true" hidden>
      <p class="eyebrow"><span aria-hidden="true"></span><span id="quote-author"></span></p>
      <p class="description" id="quote-text"></p>
    </section>

    <p class="feed-message" id="feed-message" role="status">Gathering the posts…</p>
    <p class="sr-only" id="interaction-hint">Enable “Interact with posts” in the toolbar to use post links and videos.</p>
    <ul class="card-stage" id="feed" role="list" data-interactive="false" aria-label="Posts from across your networks" aria-describedby="interaction-hint" aria-busy="true" tabindex="-1"></ul>
    <p class="sr-only" id="shuffle-status" role="status" aria-live="polite"></p>
    <noscript><p class="feed-message">Enable JavaScript to load the embedded posts.</p></noscript>

    <footer class="site-footer"><span class="footer-spark" aria-hidden="true">✧</span> Author: <a rel="me" href="https://mastodon.social/gjorgji_vasileski">Gjorgji Vasileski</a></footer>
  </main>
  <script>
    // Browsers block ES modules and text-file fetching when opened directly.
    if (location.protocol === 'file:') {
      document.querySelector('#feed-message').textContent = 'To load posts.txt, run python3 -m http.server 8000 in this folder, then open http://localhost:8000.';
      document.querySelector('#feed').setAttribute('aria-busy', 'false');
    }
  </script>
</body>
</html>
